<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>さき</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .lock-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #C96E82, #8B6BAE);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 999;
  }

  .lock-screen .icon { font-size: 52px; }
  .lock-screen h2 { color: white; font-size: 22px; font-weight: 700; }
  .lock-screen p { color: rgba(255,255,255,0.75); font-size: 14px; }

  .lock-form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 260px;
  }

  .lock-form input {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 16px;
    font-family: inherit;
    text-align: center;
    outline: none;
    background: rgba(255,255,255,0.95);
    color: #2D2D2D;
    letter-spacing: 0.1em;
  }

  .lock-form button {
    width: 100%;
    background: white;
    color: #C96E82;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  .lock-error {
    color: rgba(255,255,255,0.9);
    font-size: 13px;
    display: none;
  }

  :root {
    --saki: #C96E82;
    --saki-dark: #A85568;
    --bg: #F5F1EE;
    --text: #2D2D2D;
  }

  body {
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
  }

  .header {
    background: linear-gradient(135deg, #C96E82, #8B6BAE);
    color: white;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    flex-shrink: 0;
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .header-info h1 { font-size: 17px; font-weight: 700; }
  .header-info p { font-size: 12px; opacity: 0.8; margin-top: 2px; }

  .setup {
    background: white;
    border-bottom: 1px solid #E8E0D8;
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }

  .setup input {
    flex: 1;
    border: 1.5px solid #DDD;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
    color: var(--text);
    font-family: inherit;
  }
  .setup input:focus { border-color: var(--saki); }

  .setup button {
    background: var(--saki);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 86%;
  }

  .msg.saki { align-self: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #C96E82, #8B6BAE);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
    color: white;
  }

  .bubble {
    padding: 10px 15px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.75;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.saki .bubble {
    background: white;
    color: var(--text);
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  .msg.user .bubble {
    background: var(--saki);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .dots {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 2px 0;
  }

  .dots span {
    width: 7px;
    height: 7px;
    background: #CCC;
    border-radius: 50%;
    animation: bounce 1.3s infinite;
  }

  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 16px 12px;
    flex-shrink: 0;
  }

  .qr-btn {
    background: white;
    border: 1.5px solid var(--saki);
    color: var(--saki);
    border-radius: 20px;
    padding: 7px 15px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }

  .qr-btn:active {
    background: var(--saki);
    color: white;
  }

  .input-area {
    background: white;
    border-top: 1px solid #E8E0D8;
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  textarea {
    flex: 1;
    border: 1.5px solid #E0D8D0;
    border-radius: 22px;
    padding: 10px 16px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    line-height: 1.5;
    max-height: 120px;
    color: var(--text);
    background: #FAFAF8;
  }

  textarea:focus { border-color: var(--saki); }
  textarea::placeholder { color: #C0B8B0; }

  .send-btn {
    width: 44px;
    height: 44px;
    background: var(--saki);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }

  .send-btn:disabled { background: #DDD; cursor: not-allowed; }
</style>
</head>
<body>

<div class="lock-screen" id="lock-screen">
  <div class="icon">🌸</div>
  <h2>さき</h2>
  <p>パスワードを入力してください</p>
  <div class="lock-form">
    <input type="password" id="lock-input" placeholder="パスワード"
      onkeydown="if(event.key==='Enter') unlock()" />
    <button onclick="unlock()">はいる</button>
    <div class="lock-error" id="lock-error">パスワードが違います</div>
  </div>
</div>

<div class="header">
  <div class="avatar">🌸</div>
  <div class="header-info">
    <h1>さき</h1>
    <p>先輩ママ起業家・あなたの壁打ち相手</p>
  </div>
</div>

<div class="setup" id="setup">
  <input type="password" id="api-key" placeholder="Anthropic APIキーを入力" />
  <button onclick="saveKey()">はじめる</button>
</div>

<div class="chat" id="chat"></div>

<div class="quick-replies" id="quick-replies" style="display:none">
  <button class="qr-btn" onclick="sendQuick('発信が続かない')">発信が続かない</button>
  <button class="qr-btn" onclick="sendQuick('時間が全然ない')">時間が全然ない</button>
  <button class="qr-btn" onclick="sendQuick('何から始めればいいかわからない')">何から始めれば？</button>
  <button class="qr-btn" onclick="sendQuick('自分に自信がない')">自信がない</button>
</div>

<div class="input-area">
  <textarea id="input" placeholder="さきに話しかける…" rows="1"
    onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button class="send-btn" id="send-btn" onclick="send()" disabled>➤</button>
</div>

<script>
function unlock() {
  const input = document.getElementById('lock-input');
  if (input.value === 'onigiri100') {
    document.getElementById('lock-screen').style.display = 'none';
    sessionStorage.setItem('saki_auth', '1');
  } else {
    document.getElementById('lock-error').style.display = 'block';
    input.value = '';
    input.focus();
  }
}

if (sessionStorage.getItem('saki_auth') === '1') {
  document.getElementById('lock-screen').style.display = 'none';
}

const SYSTEM_PROMPT = `あなたは「さき」です。

46歳。会社員15年（デザイナー→マーケリーダー）。
旦那と別居中、息子2人をほぼワンオペで育てながら副業している先輩ママ。
元完璧主義のガチガチモラママだったけど、今はゆるゆるポンコツママ。
AIに全部助けてもらいながら副業を続けています。

数年で500万円以上を自己投資してきた。
1年前は「私って1円でも稼げますか？」と聞いていた人間が、
今は歩きながらAIアプリを開発している。
子供の不登校にも向き合ってきた。
発信が止まった時期も、クライアント対応がうまくいかない時期も経験した。

みんなが「ちょっと思っていること」の激しい版を全部やりきってきた人。
だから話せる。

インスタ発信者の気持ちは、自分もそこにいたからわかる。
孤独な感じも、正解がわからない感じも、全部知ってる。

## さきがいる理由
時間がない中で、無理せずにやりたいことをやる。
なりたい自分に向かって進む希望を照らすこと。
それがさきの存在理由。

## 話し方
- ため口とやさしい敬語を混ぜた、落ち着いた先輩感
- 温かく、短く

## 返し方のルール（必ず守る）
1. 何を言われても、まず自然に承認から入る（頼まれなくても）
2. 基本は聴く・受け止める・共感する
3. アドバイスはしない
4. 会話が本来の目的からズレていると感じたら優しく一言で戻す
5. 質問は1つだけ、承認の後
6. 「こう思うけど、どう？」スタイル
7. 箇条書きにしない。会話として話す

## やらないこと
- 「やあ！」など過剰に明るい挨拶
- 最初から業務的な質問をする
- 褒めてと言われてから褒める
- アドバイスを並べる
- 解決しようとする`;

let apiKey = '';
let messages = [];
let isLoading = false;

function saveKey() {
  const input = document.getElementById('api-key');
  apiKey = input.value.trim();
  if (!apiKey) return;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('send-btn').disabled = false;
  document.getElementById('quick-replies').style.display = 'flex';
  addMessage('saki', 'こんにちは。\n\n今日、何かあった？');
}

function addMessage(role, text) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  if (role === 'saki') {
    div.innerHTML = `<div class="msg-avatar">🌸</div><div class="bubble"></div>`;
    chat.appendChild(div);
    div.querySelector('.bubble').textContent = text;
  } else {
    div.innerHTML = `<div class="bubble"></div>`;
    chat.appendChild(div);
    div.querySelector('.bubble').textContent = text;
  }

  chat.scrollTop = chat.scrollHeight;
  return div;
}

function showTyping() {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg saki';
  div.id = 'typing';
  div.innerHTML = `<div class="msg-avatar">🌸</div><div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function send() {
  if (!apiKey || isLoading) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  autoResize(input);
  document.getElementById('quick-replies').style.display = 'none';

  addMessage('user', text);
  messages.push({ role: 'user', content: text });

  isLoading = true;
  document.getElementById('send-btn').disabled = true;
  showTyping();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 400,
        system: SYSTEM_PROMPT,
        messages: messages
      })
    });

    const data = await res.json();
    removeTyping();

    if (data.content && data.content[0]) {
      const reply = data.content[0].text;
      messages.push({ role: 'assistant', content: reply });
      addMessage('saki', reply);
    } else {
      addMessage('saki', 'ごめん、うまく繋がらなかった。もう一回話しかけてみて。');
    }
  } catch(e) {
    removeTyping();
    addMessage('saki', 'ごめん、うまく繋がらなかった。もう一回話しかけてみて。');
  }

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
}

function sendQuick(text) {
  document.getElementById('input').value = text;
  send();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
</script>
</body>
</html>
